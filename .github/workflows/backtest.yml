name: Trendo filtro testas

on:
  workflow_dispatch:        # tik rankiniu budu: Actions -> Trendo filtro testas -> Run workflow

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backtest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy matplotlib
      - run: python trend_backtest.py
      - name: Issaugoti ataskaita
        run: |
          git config user.name "fomo-check-bot"
          git config user.email "fomo-check-bot@users.noreply.github.com"
          git add trend_backtest_report.txt trend_backtest_curves.csv trend_backtest.png
          git diff --cached --quiet || git commit -m "Trendo filtro testas $(date -u +%F)"
          git pull --rebase
          git push
